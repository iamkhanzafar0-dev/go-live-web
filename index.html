<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO LIVE Broadcast Studio • PureSunni Network</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #151923;
      --panel-top: #1f2533;
      --border: #2a3142;
      --red: #ff3b30;
      --red-dark: #9e1510;
      --amber: #ffbe0b;
      --green: #10b981;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: radial-gradient(circle at top, #151a26, var(--bg)); color: var(--text); min-height: 100vh; padding: 14px; }
    .container { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

    /* Animated Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(180deg, var(--panel-top), var(--panel));
      border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .live-dot {
      width: 12px; height: 12px; border-radius: 50%; background: var(--red);
      box-shadow: 0 0 12px var(--red); animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse { from { transform: scale(0.9); opacity: 0.7; } to { transform: scale(1.3); opacity: 1; } }
    .title {
      font-size: 20px; font-weight: 900; letter-spacing: 1.5px;
      background: linear-gradient(90deg, #fff, #ffd54f, #ff5252, #fff);
      background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shine 2.5s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }
    .subtitle { font-size: 11px; color: var(--amber); font-weight: 700; letter-spacing: 1px; }
    .badge {
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800;
      background: #1f2430; border: 1px solid var(--border); color: var(--muted);
    }
    .badge.live { background: rgba(255,59,48,0.18); border-color: var(--red); color: var(--red); }

    /* Preview Canvas */
    .studio-card {
      background: linear-gradient(180deg, var(--panel-top), var(--panel));
      border: 1px solid var(--border); border-radius: 18px; padding: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .canvas-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
      border-radius: 12px; overflow: hidden; border: 1.5px solid #2c3345;
    }
    canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
    .source-pill {
      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 700; color: var(--amber);
    }

    /* Controls Grid */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    button, .file-btn {
      background: linear-gradient(180deg, #282f3e, #161a23); color: var(--text);
      border: 1px solid var(--border); border-radius: 11px; padding: 11px 10px;
      font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
      transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    button:hover, .file-btn:hover { border-color: #4b5563; }
    button.active {
      background: linear-gradient(180deg, #e53935, #8e1414);
      border-color: var(--red); color: #fff; box-shadow: 0 4px 14px rgba(255,59,48,0.35);
    }
    button.amber-active {
      background: rgba(255,190,11,0.2); border-color: var(--amber); color: var(--amber);
    }
    input[type="file"] { display: none; }

    /* Telemetry + Audio Meter */
    .telemetry {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center;
      padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .t-label { font-size: 10px; color: var(--muted); letter-spacing: 0.8px; }
    .t-val { font-size: 14px; font-weight: 800; font-family: monospace; margin-top: 2px; }
    .meter-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .meter-bar-bg {
      flex: 1; height: 10px; background: #090b10; border-radius: 6px;
      border: 1px solid var(--border); overflow: hidden;
    }
    .meter-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--green), var(--amber), var(--red));
      transition: width 0.08s linear;
    }

    /* RTMP & Overlay Inputs */
    .row-input { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    input[type="text"], select {
      flex: 1; min-width: 180px; background: #0d1017; border: 1px solid var(--border);
      color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 13px;
    }

    /* Go Live Action Bar */
    .action-bar { display: flex; gap: 10px; }
    .go-live-btn {
      flex: 1; padding: 15px; font-size: 15px; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(180deg, #ff453a, #b71c1c); border-color: #ff6b6b;
      box-shadow: 0 8px 22px rgba(255,59,48,0.4);
    }
    .go-live-btn.streaming { background: linear-gradient(180deg, #2b313e, #161920); border-color: var(--red); }
    .kill-btn { width: 56px; background: #3b1013; border-color: var(--red-dark); color: var(--red); font-size: 18px; }

    footer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 0 18px; }
    footer a { color: var(--red); font-weight: 700; text-decoration: underline; }
    @media (max-width: 600px) { .grid-4, .telemetry { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="live-dot"></div>
        <div>
          <div class="title">GO LIVE</div>
          <div class="subtitle">PureSunni Network • Web Broadcast Studio</div>
        </div>
      </div>
      <div id="statusBadge" class="badge">OFFLINE</div>
    </header>

    <div class="studio-card">
      <div class="canvas-wrap">
        <canvas id="studioCanvas" width="1280" height="720"></canvas>
        <div id="sourcePill" class="source-pill">CAMERA / READY</div>
      </div>

      <div class="grid-4">
        <button id="btnCam" class="active" onclick="startCamera()">Camera</button>
        <button id="btnScreen" onclick="startScreenShare()">Screen / Tab</button>
        <label class="file-btn">
          Local Video / Loop
          <input type="file" id="videoInput" accept="video/*" multiple onchange="loadLocalVideos(event)" />
        </label>
        <label class="file-btn">
          Poster / Overlay
          <input type="file" id="posterInput" accept="image/*" onchange="loadPosterImage(event)" />
        </label>
      </div>

      <div class="grid-2">
        <button id="btnAudioOnly" onclick="toggleAudioOnly()">Audio Only + Poster: OFF</button>
        <button id="btnMic" class="amber-active" onclick="toggleMic()">Mic Audio: ON</button>
      </div>

      <div class="row-input">
        <input type="text" id="tickerInput" placeholder="Live Scrolling Ticker Text (e.g. PureSunni Network Live)" oninput="updateTicker()" />
        <select id="resSelect" onchange="updateResolution()">
          <option value="1280x720">720p HD (30 fps)</option>
          <option value="1920x1080">1080p Full HD (30 fps)</option>
          <option value="854x480">480p Data Saver (30 fps)</option>
        </select>
      </div>
    </div>

    <div class="studio-card">
      <div class="telemetry">
        <div><div class="t-label">DURATION</div><div id="tDuration" class="t-val">00:00:00</div></div>
        <div><div class="t-label">TARGET BITRATE</div><div id="tBitrate" class="t-val">2500k</div></div>
        <div><div class="t-label">HEALTH</div><div id="tHealth" class="t-val" style="color:var(--green)">HEALTHY</div></div>
        <div><div class="t-label">NETWORK</div><div id="tNet" class="t-val" style="color:var(--green)">ONLINE</div></div>
      </div>
      <div class="meter-row">
        <span style="font-size:11px;font-weight:800;color:var(--muted)">AUDIO</span>
        <div class="meter-bar-bg"><div id="audioBar" class="meter-bar-fill"></div></div>
        <span id="audioDbText" style="font-size:11px;font-family:monospace;font-weight:800;color:var(--green)">-60dB • SILENT</span>
      </div>
    </div>

    <div class="studio-card">
      <div class="t-label" style="margin-bottom:6px">RTMP STREAM DESTINATIONS (YOUTUBE / FACEBOOK / CUSTOM)</div>
      <div class="row-input">
        <input type="text" id="rtmpUrl" placeholder="rtmp://a.rtmp.youtube.com/live2/YOUR_STREAM_KEY" />
        <input type="text" id="relayUrl" value="ws://localhost:8080" placeholder="WebSocket Relay URL (wss://your-relay.onrender.com)" />
      </div>
    </div>

    <div class="action-bar">
      <button id="btnGoLive" class="go-live-btn" onclick="toggleStream()">START LIVE STREAM</button>
      <button class="kill-btn" title="Emergency Stop" onclick="emergencyStop()">⏻</button>
    </div>

    <footer>
      Creator by Zafar Khan • <a href="https://www.youtube.com/@PureSunniNetwork" target="_blank">Pure Sunni Network</a>
    </footer>
  </div>

  <video id="hiddenVideo" playsinline muted loop style="display:none"></video>

  <script>
    const canvas = document.getElementById('studioCanvas');
    const ctx = canvas.getContext('2d');
    const hiddenVideo = document.getElementById('hiddenVideo');

    let activeStream = null;
    let posterImg = null;
    let audioOnlyMode = false;
    let micEnabled = true;
    let tickerText = "";
    let tickerX = canvas.width;
    let isLive = false;
    let mediaRecorder = null;
    let ws = null;
    let timerInterval = null;
    let secondsElapsed = 0;

    // Audio Context for Live dB Meter + Mixer
    let audioCtx, analyser, micSource, destNode;

    async function initAudio(stream) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        destNode = audioCtx.createMediaStreamDestination();
      }
      if (micSource) micSource.disconnect();
      if (stream && stream.getAudioTracks().length > 0) {
        micSource = audioCtx.createMediaStreamSource(stream);
        micSource.connect(analyser);
        micSource.connect(destNode);
      }
      updateAudioMeter();
    }

    function updateAudioMeter() {
      if (!analyser) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / data.length);
      const db = rms > 0.001 ? Math.max(-60, Math.round(20 * Math.log10(rms))) : -60;
      const pct = micEnabled ? Math.min(100, Math.max(0, ((db + 60) / 60) * 100)) : 0;
      document.getElementById('audioBar').style.width = pct + '%';

      const labelEl = document.getElementById('audioDbText');
      if (!micEnabled) {
        labelEl.textContent = "MUTED"; labelEl.style.color = "var(--red)";
      } else if (db >= -2) {
        labelEl.textContent = `${db}dB • CLIPPED`; labelEl.style.color = "var(--red)";
      } else if (db <= -50) {
        labelEl.textContent = `${db}dB • SILENT`; labelEl.style.color = "var(--muted)";
      } else {
        labelEl.textContent = `${db}dB • NORMAL`; labelEl.style.color = "var(--green)";
      }
      requestAnimationFrame(updateAudioMeter);
    }

    async function startCamera() {
      try {
        if (activeStream) activeStream.getTracks().forEach(t => t.stop());
        activeStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true });
        hiddenVideo.srcObject = activeStream;
        await hiddenVideo.play();
        document.getElementById('sourcePill').textContent = "CAMERA • LIVE INPUT";
        setActiveBtn('btnCam');
        await initAudio(activeStream);
      } catch (e) {
        alert("Camera/Mic permission required: " + e.message);
      }
    }

    async function startScreenShare() {
      try {
        if (activeStream) activeStream.getTracks().forEach(t => t.stop());
        activeStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        hiddenVideo.srcObject = activeStream;
        await hiddenVideo.play();
        document.getElementById('sourcePill').textContent = "SCREEN / TAB CAPTURE";
        setActiveBtn('btnScreen');
        await initAudio(activeStream);
      } catch (e) { console.warn(e); }
    }

    function loadLocalVideos(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (activeStream) activeStream.getTracks().forEach(t => t.stop());
      hiddenVideo.srcObject = null;
      hiddenVideo.src = URL.createObjectURL(file);
      hiddenVideo.muted = false;
      hiddenVideo.play();
      document.getElementById('sourcePill').textContent = "24/7 LOOP • " + file.name;
      setActiveBtn('');
    }

    function loadPosterImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => { posterImg = img; };
      img.src = URL.createObjectURL(file);
    }

    function toggleAudioOnly() {
      audioOnlyMode = !audioOnlyMode;
      const btn = document.getElementById('btnAudioOnly');
      btn.textContent = `Audio Only + Poster: ${audioOnlyMode ? 'ON' : 'OFF'}`;
      btn.classList.toggle('amber-active', audioOnlyMode);
    }

    function toggleMic() {
      micEnabled = !micEnabled;
      if (activeStream) activeStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
      const btn = document.getElementById('btnMic');
      btn.textContent = `Mic Audio: ${micEnabled ? 'ON' : 'OFF'}`;
      btn.classList.toggle('amber-active', micEnabled);
    }

    function updateTicker() {
      tickerText = document.getElementById('tickerInput').value.trim();
      tickerX = canvas.width;
    }

    function updateResolution() {
      const [w, h] = document.getElementById('resSelect').value.split('x').map(Number);
      canvas.width = w; canvas.height = h;
      document.getElementById('tBitrate').textContent = w === 1920 ? '4500k' : w === 1280 ? '2500k' : '1000k';
    }

    function setActiveBtn(id) {
      ['btnCam', 'btnScreen'].forEach(b => document.getElementById(b).classList.remove('active'));
      if (id) document.getElementById(id).classList.add('active');
    }

    // 30 FPS Compositor Render Loop
    function renderLoop() {
      ctx.fillStyle = '#07090d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!audioOnlyMode && hiddenVideo.readyState >= 2) {
        ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
      }
      if (posterImg) {
        if (audioOnlyMode) {
          ctx.drawImage(posterImg, 0, 0, canvas.width, canvas.height);
        } else {
          // Corner Logo Overlay
          const w = canvas.width * 0.16;
          const h = (posterImg.height / posterImg.width) * w;
          ctx.drawImage(posterImg, canvas.width - w - 24, 24, w, h);
        }
      }
      if (tickerText) {
        ctx.fillStyle = 'rgba(183, 28, 28, 0.92)';
        ctx.fillRect(0, canvas.height - 46, canvas.width, 46);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px system-ui';
        ctx.fillText(tickerText, tickerX, canvas.height - 15);
        tickerX -= 3;
        if (tickerX < -ctx.measureText(tickerText).width) tickerX = canvas.width;
      }
      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    function toggleStream() {
      if (isLive) { stopStream(); return; }
      const rtmp = document.getElementById('rtmpUrl').value.trim();
      const relay = document.getElementById('relayUrl').value.trim();
      if (!rtmp) { alert("Please enter your YouTube/Facebook RTMP URL + Stream Key"); return; }

      try {
        ws = new WebSocket(`${relay}?rtmp=${encodeURIComponent(rtmp)}`);
        ws.onopen = () => {
          const canvasStream = canvas.captureStream(30);
          if (destNode) destNode.stream.getAudioTracks().forEach(t => canvasStream.addTrack(t));
          mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 2500000 });
          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0 && ws.readyState === 1) ws.send(e.data); };
          mediaRecorder.start(250);
          setLiveUI(true);
        };
        ws.onerror = () => alert("Relay server connect nahi hua. Pehle free Render/Node relay deploy karein.");
        ws.onclose = () => { if (isLive) stopStream(); };
      } catch (err) { alert(err.message); }
    }

    function stopStream() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (ws) ws.close();
      setLiveUI(false);
    }

    function emergencyStop() {
      stopStream();
      if (activeStream) activeStream.getTracks().forEach(t => t.stop());
      hiddenVideo.pause();
    }

    function setLiveUI(live) {
      isLive = live;
      const badge = document.getElementById('statusBadge');
      const btn = document.getElementById('btnGoLive');
      badge.textContent = live ? '● LIVE' : 'OFFLINE';
      badge.classList.toggle('live', live);
      btn.textContent = live ? 'STOP LIVE STREAM' : 'START LIVE STREAM';
      btn.classList.toggle('streaming', live);

      clearInterval(timerInterval);
      if (live) {
        secondsElapsed = 0;
        timerInterval = setInterval(() => {
          secondsElapsed++;
          const h = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
          const m = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
          const s = String(secondsElapsed % 60).padStart(2, '0');
          document.getElementById('tDuration').textContent = `${h}:${m}:${s}`;
        }, 1000);
      }
    }

    window.addEventListener('online', () => { document.getElementById('tNet').textContent = 'ONLINE'; });
    window.addEventListener('offline', () => { document.getElementById('tNet').textContent = 'OFFLINE'; });
  </script>
</body>
</html>
